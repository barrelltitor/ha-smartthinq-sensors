download_course:
  name: Download course
  description: >-
    Replace the appliance download slot with a model-supported Smart Course and
    stage that course for the next Remote Start. This sends a command to the
    appliance but does not start it.
  target:
    entity:
      integration: smartthinq_sensors
      domain: sensor
  fields:
    course:
      name: Course
      description: Exact course name from the downloadable_courses sensor attribute.
      required: true
      selector:
        text:

prepare_course:
  name: Prepare course
  description: >-
    Validate and stage a washer course and its options in Home Assistant without
    sending a start command to the appliance.
  target:
    entity:
      integration: smartthinq_sensors
      domain: sensor
  fields:
    course:
      name: Course
      description: Exact course name from the washer course selection entity.
      required: true
      selector:
        text:
    overrides:
      name: Course option overrides
      description: >-
        Option values for the selected course, using keys and values from the
        washer model data (for example, {"temp": "TEMP_40", "spin": "SPIN_1200",
        "dryLevel": "DRYLEVEL_60"}).
      required: false
      selector:
        object:

remote_start:
  name: Remote Start
  description: Send to ThinQ device the remote start command.
  target:
    entity:
      integration: smartthinq_sensors
      domain: sensor
  fields:
    course:
      name: Course
      description: >-
        Course to start. If omitted, a prepared course is used when available;
        otherwise the current appliance course is used.
      required: false
      selector:
        text:
    overrides:
      name: Course option overrides
      description: >-
        Option values for the selected course, using keys and values from the
        washer model data (for example, {"temp": "TEMP_40", "spin": "SPIN_1200",
        "dryLevel": "DRYLEVEL_60"}).
      required: false
      selector:
        object:

wake_up:
  name: WakeUp
  description: Send to ThinQ device the wakeup command.
  target:
    entity:
      integration: smartthinq_sensors
      domain: sensor

set_time:
  name: Set time
  description: Set time device.
  target:
    entity:
      integration: smartthinq_sensors
      domain: sensor
  fields:
    time_wanted:
      name: time
      description: Time (if not set will use Home-Assistant time)
      required: false
      selector:
        time:

set_fan_mode:
  name: Set fan mode
  description: Set fan operation for dehumidifier device.
  target:
    entity:
      integration: smartthinq_sensors
      domain: humidifier
  fields:
    fan_mode:
      name: Fan mode
      description: New value of fan mode.
      required: true
      example: "low"
      selector:
        text:

set_sleep_time:
  name: Set sleep time
  description: Set sleep time.
  target:
    entity:
      integration: smartthinq_sensors
      domain: climate
  fields:
    sleep_time:
      name: "Timeout"
      description: Timeout for sleep mode in minutes
      default: 60
      required: true
      selector:
        number:
          min: 0
          max: 720
          mode: box
          unit_of_measurement: minutes
